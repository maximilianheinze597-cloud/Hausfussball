<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>Hausfußball Live</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 24px 20px;
      background: #111a2e;
      border-bottom: 1px solid #26324a;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 6px;
      color: #9aa7bd;
    }

    main {
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    .section-title {
      font-size: 20px;
      margin: 10px 0 14px;
    }

    .match {
      background: #151f34;
      border: 1px solid #293750;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .live {
      display: inline-block;
      background: #e53935;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .teams {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .team {
      width: 40%;
      text-align: center;
      font-weight: bold;
    }

    .score {
      font-size: 38px;
      font-weight: bold;
    }

    .minute {
      color: #9aa7bd;
      font-size: 14px;
      margin-top: 5px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .empty {
      background: #151f34;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      color: #9aa7bd;
    }

    footer {
      text-align: center;
      color: #64748b;
      padding: 30px 20px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>⚽ Hausfußball Live</h1>
    <p>Dein Live-Ticker für Hobbyfußball</p>
  </header>

  <main>
    <h2 class="section-title">🔴 Live</h2>

    <div class="match">
      <span class="live">● LIVE</span>

      <div class="teams">
        <div class="team">Hausmannschaft</div>

        <div>
          <div class="score">0 : 0</div>
          <div class="minute">1. Halbzeit · 00:00</div>
        </div>

        <div class="team">Gegner</div>
      </div>

      <button onclick="openMatch()">
        Live-Spiel öffnen
      </button>
    </div>

    <h2 class="section-title">📅 Nächste Spiele</h2>

    <div class="empty">
      Noch keine kommenden Spiele.
    </div>
  </main>

  <footer>
    Hausfußball Live · Version 0.1
  </footer>

  <script>
    function openMatch() {
      alert("Der Live-Ticker kommt als Nächstes! ⚽");
    }
  </script>

</body>
</html>
